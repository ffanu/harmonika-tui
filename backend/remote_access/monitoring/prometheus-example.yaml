# Credentials file is private to Prometheus; never embed the token here.
scrape_configs:
  - job_name: harmonika-ssh
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/harmonika-remote/api.token
    static_configs:
      - targets: [127.0.0.1:18231]
rule_files: [alerts.yaml]
