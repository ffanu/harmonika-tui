services:
  db:
    image: postgres:16.11
    environment:
      POSTGRES_USER: erp_owner
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?set unique database owner password}
      POSTGRES_DB: erp
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set unique runtime database password}
    volumes:
      - erp-data:/var/lib/postgresql/data
      - ./ops/init-runtime-role.sh:/docker-entrypoint-initdb.d/10-app.sh:ro
    healthcheck: {test: [CMD-SHELL, "pg_isready -U erp_owner -d erp"], interval: 3s, timeout: 3s, retries: 20}
    restart: unless-stopped
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://erp_app:${APP_DB_PASSWORD:?required}@db:5432/erp
      JWT_SECRET: ${JWT_SECRET:?required}
      APP_ORIGIN: ${APP_ORIGIN:?required}
      COOKIE_SECURE: "true"
    depends_on: {db: {condition: service_healthy}}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  web:
    build: .
    command: [npm, run, start, -w, apps/web]
    environment: {API_INTERNAL_URL: "http://api:4000", NEXT_TELEMETRY_DISABLED: "1"}
    ports: ["127.0.0.1:${WEB_PORT:-18400}:3000"]
    depends_on: [api]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
volumes: {erp-data: {}}
