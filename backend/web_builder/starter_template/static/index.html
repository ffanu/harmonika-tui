<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inventori</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head><body><header><a class="brand" href="/">Inventori</a><button id="logout" hidden>Keluar</button></header><main><section id="login-panel"><p class="eyebrow">RUANG KERJA PRIVAT</p><h1>Kelola stok dengan jelas.</h1><p>Masuk untuk melihat dan memperbarui inventori.</p><form id="login"><label for="password">Kata sandi pemilik</label><input id="password" type="password" autocomplete="current-password" required><button>Masuk</button></form></section><section id="workspace" hidden><p class="eyebrow">INVENTORI</p><h1>Barang dan persediaan</h1><div class="grid"><form id="item-form"><h2 id="form-title">Tambah barang</h2><input id="item-id" type="hidden"><label for="name">Nama barang</label><input id="name" maxlength="120" required><label for="quantity">Jumlah</label><input id="quantity" type="number" value="0" min="0" max="1000000" step="1" required><div class="actions"><button id="save">Simpan</button><button id="cancel" type="button" class="secondary" hidden>Batal</button></div></form><section class="list"><div class="list-head"><h2>Daftar barang</h2><span id="count"></span></div><div id="items"></div><div class="actions"><button id="previous" class="secondary">Sebelumnya</button><button id="next" class="secondary">Berikutnya</button></div></section></div></section><p id="status" role="status" aria-live="polite"></p></main><footer>Data tersimpan di database proyek Anda.</footer></body></html>
