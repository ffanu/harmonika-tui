name: Installer platforms

on:
  push:
    paths:
      - 'runtime/**'
      - 'scripts/install.*'
      - 'skills/**'
      - 'backend/**'
      - 'tests/installer_platform_smoke.py'
      - 'tests/test_bootstrap.py'
      - 'tests/test_releases.py'
      - 'tests/test_platform_release_integrity.py'
      - 'tests/test_installer_portability.py'
      - 'tests/test_license.py'
      - 'tests/test_installer_onboarding.py'
      - 'tests/test_installer_agent_parity.py'
      - 'tests/test_feature_setup.py'
      - 'tests/test_portable_owner_mcp.py'
      - 'tests/*parity*.test.cjs'
      - 'tests/agent-v32*.test.cjs'
      - '.github/workflows/installer-platforms.yml'
  pull_request:
    paths:
      - 'runtime/**'
      - 'scripts/install.*'
      - 'skills/**'
      - 'backend/**'
      - 'tests/installer_platform_smoke.py'
      - 'tests/test_bootstrap.py'
      - 'tests/test_releases.py'
      - 'tests/test_platform_release_integrity.py'
      - 'tests/test_installer_portability.py'
      - 'tests/test_license.py'
      - 'tests/test_installer_onboarding.py'
      - 'tests/test_installer_agent_parity.py'
      - 'tests/test_feature_setup.py'
      - 'tests/test_portable_owner_mcp.py'
      - 'tests/*parity*.test.cjs'
      - 'tests/agent-v32*.test.cjs'
      - '.github/workflows/installer-platforms.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: ${{ matrix.platform }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, platform: linux-x64, node: '22'}
          - {os: ubuntu-24.04-arm, platform: linux-arm64, node: '22'}
          - {os: macos-15-intel, platform: darwin-x64, node: '22'}
          - {os: macos-15, platform: darwin-arm64, node: '22'}
          - {os: windows-2022, platform: windows-x64, node: '22'}
          - {os: ubuntu-24.04, platform: linux-x64, node: '18'}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Parse the Windows PowerShell installer
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts\install.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw 'PowerShell installer syntax validation failed.' }
      - name: Parse the POSIX shell installer
        if: runner.os != 'Windows'
        shell: bash
        run: sh -n scripts/install.sh
      - name: Verify POSIX installer regression tests
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -e
          python -m unittest discover -s tests -p test_bootstrap.py
          python -m unittest discover -s tests -p test_releases.py
          python -m unittest discover -s tests -p test_platform_release_integrity.py
          python -m unittest discover -s tests -p test_installer_portability.py
      - name: Verify license gate and piped onboarding
        shell: bash
        run: |
          python -m unittest discover -s tests -p test_license.py
          python -m unittest discover -s tests -p test_installer_onboarding.py
      - name: Verify portable agent and plugin regressions
        shell: bash
        run: |
          set -e
          python -m unittest discover -s tests -p test_installer_agent_parity.py
          python -m unittest discover -s tests -p test_feature_setup.py
          python -m unittest discover -s tests -p test_feature_system_deps.py
          python -m unittest discover -s tests -p test_portable_owner_mcp.py
          python -m unittest discover -s tests -p test_ssh_portability.py
          python -m unittest discover -s tests -p test_portable_skill_workers.py
          python -m unittest discover -s tests -p test_worker_stdio.py
          python -m unittest discover -s tests -p test_launcher_stdio.py
          node --test tests/agent-v32.test.cjs tests/agent-v32-portability.test.cjs tests/portable-plugin-parity.test.cjs tests/native-video-companion.test.cjs tests/native-system-update.test.cjs
      - name: Build current source and install without npm
        shell: bash
        run: python tests/installer_platform_smoke.py --work-root "$RUNNER_TEMP" --expected-platform "${{ matrix.platform }}" --output "installer-smoke-${{ matrix.platform }}-node${{ matrix.node }}.json"
      - name: Preserve mechanics-only report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: installer-${{ matrix.platform }}-node${{ matrix.node }}
          path: installer-smoke-${{ matrix.platform }}-node${{ matrix.node }}.json
          if-no-files-found: warn
          retention-days: 7
